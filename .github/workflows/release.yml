name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64 tarball
    # Deliberately *not* built through nix-shell, unlike ci.yml. A binary linked
    # against nixpkgs' glibc carries an ELF interpreter under /nix/store and will
    # not start on an ordinary distribution — exactly the user a downloadable
    # tarball is for. Building on the oldest supported runner links against its
    # glibc instead, which newer systems stay compatible with. Nix users are
    # better served by `nix profile install`, which this release does not need to
    # produce anything for.
    #
    # The cost is a second dependency list that can drift from shell.nix. When
    # this build breaks and CI stays green, that drift is the first thing to
    # check.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config clang cmake \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libgl-dev \
            libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxcb1-dev \
            libvulkan-dev libssl-dev libdbus-1-dev libzstd-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          # Absent on forks and on any run without repository secrets: the
          # constant then stays empty and the app asks for the user's own Google
          # registration in Preferences → Accounts. Never echo this value.
          AVIARY_GOOGLE_CLIENT_SECRET: ${{ secrets.AVIARY_GOOGLE_CLIENT_SECRET }}
        run: cargo build --release --locked

      - name: Assemble the tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          staging="aviary-${version}-x86_64-linux"
          mkdir -p "$staging"
          cp target/release/aviary "$staging/"
          cp README.md LICENSE NOTICE "$staging/"
          cp packaging/aviary.desktop packaging/aviary.svg "$staging/"
          cp packaging/install.sh "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          sha256sum "$staging.tar.gz" > "$staging.tar.gz.sha256"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            aviary-*.tar.gz
            aviary-*.tar.gz.sha256
          generate_release_notes: true
          body: |
            Linux x86_64 build. Unpack and run `./install.sh` to place the
            binary, desktop entry and icon under `~/.local`, or run `./aviary`
            directly.

            Requires the usual desktop runtime libraries (Vulkan loader,
            Wayland or X11, fontconfig, freetype, D-Bus). Nix users can instead
            run `nix profile install github:Catvert/aviary`.

  # Both of these are unsigned and produced without a machine to test them on;
  # they are attached so the platforms can be exercised at all. `if: false` is
  # deliberately absent — instead the job may fail without failing the release,
  # since Linux is what a tag promises today.
  macos:
    name: macOS ${{ matrix.arch }} bundle
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            # macos-13, the last free Intel image, was retired in December
            # 2025 — a job requesting it queues for 24 h and dies waiting.
            # macos-15-intel is GitHub's stopgap Intel label (until 2027).
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          AVIARY_GOOGLE_CLIENT_SECRET: ${{ secrets.AVIARY_GOOGLE_CLIENT_SECRET }}
        run: cargo build --release --locked

      # The bundle is what gives Aviary a bundle identifier (no identifier, no
      # notifications) and registers it as a `mailto:` handler.
      - name: Assemble Aviary.app
        run: |
          version="${GITHUB_REF_NAME#v}"
          packaging/macos/bundle.sh target/macos
          staging="aviary-${version}-${{ matrix.arch }}-macos"
          mkdir -p "$staging"
          cp -R target/macos/Aviary.app "$staging/"
          cp README.md LICENSE NOTICE "$staging/"
          zip -qry "$staging.zip" "$staging"
          shasum -a 256 "$staging.zip" > "$staging.zip.sha256"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            aviary-*.zip
            aviary-*.zip.sha256

  windows:
    name: Windows x86_64 archive
    continue-on-error: true
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          AVIARY_GOOGLE_CLIENT_SECRET: ${{ secrets.AVIARY_GOOGLE_CLIENT_SECRET }}
        run: cargo build --release --locked

      - name: Assemble the archive
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          $staging = "aviary-$version-x86_64-windows"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item target/release/aviary.exe $staging/
          Copy-Item README.md, LICENSE, NOTICE $staging/
          Copy-Item packaging/windows/register-mailto.ps1 $staging/
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          (Get-FileHash "$staging.zip" -Algorithm SHA256).Hash | Out-File "$staging.zip.sha256"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            aviary-*.zip
            aviary-*.zip.sha256
