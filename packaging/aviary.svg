<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Application icon, derived from assets/icons/aviary.svg.

       The in-app logo is a 24px line glyph inheriting `currentColor`, which a
       launcher cannot use: it has no colour of its own and its 1.8px strokes
       disappear at tray sizes. This copy keeps the same drawing on an opaque
       tile so it reads on any desktop background, light or dark. Change one
       and change the other. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B9CF8"/>
      <stop offset="1" stop-color="#2C6BD4"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#tile)"/>

  <g transform="translate(10 10) scale(1.8333)"
     fill="none" stroke="#FFFFFF" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.8 10.4a4.6 4.6 0 0 0-9-.9l-.7 3.2a5.8 5.8 0 0 1-2.5 3.6 9.4 9.4 0 0 0 7.1.8 7.7 7.7 0 0 0 5.5-5.5" />
    <path d="M5.3 12.1a7.4 7.4 0 0 1 6.1 3.3" />
    <circle cx="12" cy="8.1" r="0.75" fill="#FFFFFF" stroke="none" />
    <path d="m14.7 9.3 2.5 1.2-2.5 1.2" />
    <path d="m7.9 17.4-.5 1.7m3.6-2.5.5 1.7" />
    <rect x="16.3" y="10.4" width="6.3" height="5.2" rx="0.7" />
    <path d="m16.8 11 2.65 2.1L22.1 11" />
  </g>
</svg>
